dataset_name: mitbih
raw_dir: data/raw/mitbih
processed_path: data/processed/mitbih_binary.npz
metadata_dir: data/metadata
metadata_path: data/metadata/mitbih_binary_metadata.json
split_scheme: de_chazal_interpatient_ds1_ds2
window:
